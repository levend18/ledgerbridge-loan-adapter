services:
  postgres:
    image: postgres:16.10-bookworm
    environment:
      POSTGRES_USER: app_migrator
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-demo-password}
      POSTGRES_DB: adapter
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U app_migrator -d adapter"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - postgres-data:/var/lib/postgresql/data
  redis:
    image: redis:7.4.6-bookworm
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 2s
      timeout: 3s
      retries: 30
  dev:
    profiles: [tools]
    image: ledgerbridge-loan-adapter:local
    build: &app-build
      context: .
      dockerfile: docker/Dockerfile.dev
    volumes:
      - .:/app
    environment:
      DATABASE_URL: postgresql://app_migrator:${POSTGRES_PASSWORD:-local-demo-password}@postgres/adapter
      DB_ROLE_PASSWORD: ${DB_ROLE_PASSWORD:-local-demo-role-password}
  bank:
    image: ledgerbridge-loan-adapter:local
    build: *app-build
    command: uvicorn external_bank.app:app --host 0.0.0.0 --port 8001
    environment:
      BANK_DB: /bank/data.sqlite
    volumes:
      - bank-data:/bank
    ports:
      - "127.0.0.1:8001:8001"
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 2s
      timeout: 3s
      retries: 30
  migrate:
    image: ledgerbridge-loan-adapter:local
    build: *app-build
    command: sh -c 'python -m tools.bootstrap_db && python manage.py migrate --noinput'
    environment:
      DATABASE_URL: postgresql://app_migrator:${POSTGRES_PASSWORD:-local-demo-password}@postgres/adapter
      DB_ROLE_PASSWORD: ${DB_ROLE_PASSWORD:-local-demo-role-password}
    depends_on:
      postgres:
        condition: service_healthy
  worker:
    image: ledgerbridge-loan-adapter:local
    build: *app-build
    command: celery -A workers.celery_app worker --loglevel=INFO
    environment: &worker-environment
      DATABASE_URL_WRITER: postgresql://app_writer:${DB_ROLE_PASSWORD:-local-demo-role-password}@postgres/adapter
      POLL_INTERVAL_SECONDS: ${POLL_INTERVAL_SECONDS:-30}
    depends_on:
      migrate:
        condition: service_completed_successfully
      bank:
        condition: service_healthy
      redis:
        condition: service_healthy
  beat:
    image: ledgerbridge-loan-adapter:local
    build: *app-build
    command: celery -A workers.celery_app beat --loglevel=INFO --schedule=/tmp/celerybeat
    environment: *worker-environment
    depends_on:
      worker:
        condition: service_started
volumes:
  postgres-data:
  bank-data:
