name: CI
on: [push, pull_request]
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: make up
      - run: make build
      - run: docker compose run --rm dev pre-commit run --all-files
      - run: make lint
      - run: make test
      - run: make verify
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-evidence
          path: |
            verification-report.md
            artifacts/verification/*.xml
            artifacts/verification/*.exit
            artifacts/benchmark.json
            artifacts/docker-stats.jsonl
      - if: always()
        run: docker compose down -v
