name: CI
on: [push, pull_request]
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: make up
      - run: make build
      - run: docker compose run --rm dev pre-commit run --all-files
      - run: make lint
      - run: make test
      - if: always()
        run: docker compose down -v
