[package]
name = "adapter_engine"
version = "0.1.0"
edition = "2021"
authors = ["Levent Çelik"]
homepage = "https://github.com/levend18"
repository = "https://github.com/levend18/ledgerbridge-loan-adapter"

[lib]
name = "adapter_engine"
crate-type = ["cdylib", "rlib"]

[features]
extension-module = ["pyo3/extension-module"]

[dependencies]
pyo3 = "=0.26.0"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
serde_yaml = "=0.9.34"
rust_decimal = "=1.39.0"
chrono = "=0.4.42"
regex = "=1.12.2"
thiserror = "=2.0.17"
csv = "=1.4.0"

[dev-dependencies]
proptest = "=1.8.0"

[profile.release]
strip = true
