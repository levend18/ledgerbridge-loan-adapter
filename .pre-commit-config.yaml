repos:
  - repo: local
    hooks:
      - id: private-file-guard
        name: Reject private datasets and credentials
        entry: python3 tools/check_repository_files.py
        language: system
        types: [file]
      - id: detect-private-key
        name: Detect private keys
        entry: python3 tools/check_repository_files.py
        language: system
        types: [text]
